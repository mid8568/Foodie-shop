<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
China Direct Shop Admin
</title>

<link rel="stylesheet" href="css/admin.css">

</head>


<body>


<div class="admin-layout">



<!-- =====================
左侧菜单
===================== -->


<div class="sidebar">


<h2>
🇨🇳 CDS后台
</h2>



<!-- 商品中心 -->

<button onclick="toggleMenu('productCenter')">
商品中心 ▼
</button>


<div id="productCenter" class="submenu">


<button onclick="openPage('products')">
商品列表
</button>


<button onclick="openPage('collector')">
1688采集
</button>


<button onclick="openPage('category')">
分类管理
</button>


</div>





<!-- 素材中心 -->

<button onclick="toggleMenu('mediaCenter')">
素材中心 ▼
</button>


<div id="mediaCenter" class="submenu">


<button onclick="openPage('materials')">
图片库
</button>


<button onclick="openPage('banner')">
Banner
</button>


</div>





<!-- 店铺设置 -->

<button onclick="toggleMenu('storeCenter')">
店铺设置 ▼
</button>


<div id="storeCenter" class="submenu">


<button onclick="openPage('decorate')">
首页装修
</button>


<button onclick="openPage('notice')">
公告
</button>


</div>





<!-- 销售渠道 -->

<button onclick="toggleMenu('channelCenter')">
销售渠道 ▼
</button>


<div id="channelCenter" class="submenu">


<button onclick="openPage('ebay')">
eBay同步
</button>


<button onclick="openPage('facebook')">
Facebook分享
</button>


</div>





<!-- 系统 -->

<button onclick="toggleMenu('systemCenter')">
系统 ▼
</button>


<div id="systemCenter" class="submenu">


<button onclick="openPage('setting')">
设置
</button>


</div>



</div>








<!-- =====================
主体
===================== -->


<div class="main">





<!-- 商品列表 -->

<div id="products" class="panel">


<h1>
商品列表
</h1>


<select id="productSelect">

<option>
请选择商品
</option>

</select>





<h3>
商品中文标题
</h3>


<input id="name">





<h3>
英文标题
</h3>


<input id="name_en">





<h3>
主图
</h3>


<div id="mainImage"
class="preview">

</div>



<input
type="file"
id="mainUpload">



<button onclick="mainUpload.click()">
替换主图
</button>





<h3>
详情图片
</h3>


<div id="detailImages"
class="images">

</div>



<input
type="file"
id="detailUpload"
multiple>



<button onclick="detailUpload.click()">
添加详情图片
</button>






<h3>
商品描述
</h3>


<textarea id="description"></textarea>


<textarea id="description_en"></textarea>






<h3>
价格
</h3>


<input
id="cost_price"
placeholder="采购成本">


<input
id="sale_price"
placeholder="销售价格">






<h3>
状态
</h3>


<select id="stock_status">


<option>
上架
</option>


<option>
下架
</option>


<option>

</option>


</select>





<br><br>


<button onclick="saveProduct()">

保存修改

</button>



</div>





<!-- =====================
1688采集
===================== -->


<div id="collector"
class="panel"
style="display:none">


<h1>
1688采集
</h1>



<h3>
1688商品链接
</h3>


<input
id="collectUrl"
placeholder="粘贴1688商品详情链接">



<br><br>


<button onclick="startCollect()">

开始采集

</button>



<div id="collectResult">

</div>



</div>









<!-- =====================
分类管理
===================== -->


<div id="category"
class="panel"
style="display:none">


<h1>
分类管理
</h1>



<input
id="categoryName"
placeholder="输入分类名称">



<button>

</button>



<div id="categoryList">

</div>









<!-- =====================
图片库
===================== -->


<div id="materials"
class="panel"
style="display:none">


<h1>
图片库
</h1>




<select id="uploadType">


<option>

</option>


<option>
详情图片
</option>


<option>
Banner图片
</option>


<option>
其他
</option>


</select>




<input
type="file"
id="materialUpload">



<button onclick="uploadMaterial()">

上传图片

</button>





<h3>
图片分类
</h3>



<select id="materialCategory"
onchange="filterMaterials()">



<option>

</option>


<option>
商品主图
</option>


<option>
详情图片
</option>


<option>
Banner图片
</option>


<option>
其他
</option>



</select>





<div id="materialList"
class="material-grid">

</div>



</div>









<!-- =====================
Banner管理
===================== -->


<div id="banner"
class="panel"
style="display:none">


<h1>
Banner管理
</h1>



<div id="bannerPreview"
class="preview">

</div>



<input
type="file"
id="bannerUpload">



<button onclick="uploadBanner()">

上传Banner

</button>



</div>









<!-- =====================
首页装修
===================== -->


<div id="decorate"
class="panel"
style="display:none">


<h1>
首页装修
</h1>




<h3>
首页公告
</h3>



<textarea
id="notice"></textarea>





<h3>
首页标题
</h3>



<input
id="homeTitle"
placeholder="热门商品">





<button onclick="saveDecoration()">

保存装修

</button>



</div>









<!-- =====================
公告
===================== -->


<div id="notice"
class="panel"
style="display:none">


<h1>
店铺公告
</h1>



<textarea
placeholder="输入公告内容">
</textarea>



<button>

保存公告

</button>



</div>









<!-- =====================
eBay
===================== -->


<div id="ebay"
class="panel"
style="display:none">


<h1>
eBay同步
</h1>



<button>
同步商品
</button>



<button>
同步库存
</button>



<button>
同步价格
</button>



<button>
同步上下架
</button>



</div>









<!-- =====================
Facebook
===================== -->


<div id="facebook"
class="panel"
style="display:none">


<h1>
Facebook分享
</h1>




<select id="shareProduct">

<option>
选择商品
</option>


</select>




<br><br>


<button>

生成分享文案

</button>



<button>

分享到Facebook

</button>



</div>









<!-- =====================
系统设置
===================== -->


<div id="setting"
class="panel"
style="display:none">


<h1>
系统设置
</h1>




<h3>
1688 API地址
</h3>


<input
id="apiUrl"
placeholder="https://你的API地址">





<h3>
网站名称
</h3>


<input
id="siteName"
placeholder="China Direct Shop">





<button>

保存设置

</button>



</div>









</div>

</div>









<script>


function toggleMenu(id){


let box=document.getElementById(id);


if(box.style.display==="block"){

box.style.display="none";


}else{


box.style.display="block";


}


}







function openPage(id){



document
.querySelectorAll(".panel")
.forEach(
p=>{


p.style.display="none";


}

);



let page =
document.getElementById(id);



if(page){

page.style.display="block";

}


}








async function startCollect(){


let url =
document.getElementById("collectUrl").value;



if(!url){

alert("请输入1688链接");

return;

}



document.getElementById(
"collectResult"
).innerHTML=
"正在采集中...";



try{


let res =
await fetch(
"https://你的1688-api地址/collect",
{

method:"POST",

headers:{


"Content-Type":
"application/json"


},


body:
JSON.stringify({

url:url

})


}

);



let data =
await res.json();



console.log(data);



document.getElementById(
"collectResult"
).innerHTML=
"采集完成";


}catch(e){


console.log(e);


document.getElementById(
"collectResult"
).innerHTML=
"采集失败";


}



}





</script>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin.js"></script>



</body>

</html>
