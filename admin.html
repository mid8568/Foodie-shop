<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
CDS后台管理
</title>


<link rel="stylesheet" href="css/admin.css">

</head>


<body>


<div class="admin-layout">



<!-- 左侧菜单 -->

<aside class="sidebar">


<h2>
🇨🇳 CDS后台
</h2>



<button 
class="menu-btn active"
onclick="openPage(this,'products')">
商品管理
</button>



<button 
class="menu-btn"
onclick="openPage(this,'decorate')">
前端装修
</button>



<button 
class="menu-btn"
onclick="openPage(this,'images')">
图片管理
</button>



<button 
class="menu-btn"
onclick="openPage(this,'seo')">
SEO设置
</button>



<button 
class="menu-btn"
onclick="openPage(this,'ebay')">
eBay同步
</button>



</aside>





<!-- 主区域 -->

<main class="main">


<iframe

id="contentFrame"

src="admin-products.html">

</iframe>


</main>




</div>






<script>


function openPage(btn,page){


/*
切换菜单状态
*/


document
.querySelectorAll(".menu-btn")
.forEach(
item=>{
item.classList.remove("active");
}
);



btn.classList.add("active");




let frame =
document.getElementById(
"contentFrame"
);



let pages={

products:
"admin-products.html",


decorate:
"admin-decorate.html",


images:
"admin-images.html",


seo:
"admin-seo.html",


ebay:
"admin-ebay.html"

};



frame.src =
pages[page];



}



</script>



</body>

</html>
