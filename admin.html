<!DOCTYPE html>
<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
China Direct Shop Admin
</title>


<link rel="stylesheet" href="css/admin.css">


</head>



<body>


<div class="admin-layout">





<!-- ======================
     左侧菜单
====================== -->


<div class="sidebar">



<h2>
🇨🇳 CDS后台
</h2>





<!-- 商品管理 -->


<button onclick="toggleMenu('productMenu')">

商品管理 ▼

</button>



<div id="productMenu"
class="submenu">



<button onclick="openPage('products')">

商品列表

</button>



<button onclick="openNewProduct()">

新建商品

</button>



</div>







<!-- 素材管理 -->


<button onclick="openPage('materials')">

素材管理

</button>









<!-- 店铺管理 -->


<button onclick="toggleMenu('shopMenu')">

店铺管理 ▼

</button>




<div id="shopMenu"
class="submenu">



<button onclick="openPage('decorate')">

店铺装修

</button>



</div>








<!-- ebay -->


<button onclick="openPage('ebay')">

eBay同步

</button>



</div>














<!-- ======================
     右侧内容
====================== -->


<div class="main">







<!-- ======================
商品列表
====================== -->


<div id="products"
class="panel">


<h1>
商品管理
</h1>



<h3>
选择商品
</h3>



<select id="productSelect">


<option>

请选择商品

</option>


</select>







<h3>
商品标题
</h3>


<input id="name">







<h3>
英文标题
</h3>


<input id="name_en">







<h3>
主图
</h3>



<div id="mainImage"
class="preview">

</div>



<input
type="file"
id="mainUpload">







<h3>
详情图片
</h3>



<div id="detailImages"
class="images">


</div>



<input

type="file"

id="detailUpload"

multiple>









<h3>
商品描述
</h3>


<textarea id="description">

</textarea>




<textarea id="description_en">

</textarea>









<h3>
价格管理
</h3>



<input

id="cost_price"

placeholder="采购成本">


<input

id="sale_price"

placeholder="销售价格">



<input

id="profit_rate"

readonly

placeholder="利润率">







<h3>
商品状态
</h3>


<select id="stock_status">


<option>
上架
</option>


<option>
下架
</option>


<option>
缺货
</option>


</select>







<br><br>



<button onclick="saveProduct()">

保存修改

</button>






</div>















<!-- ======================
新建商品
跳转1688采集
====================== -->


<div id="newProduct"
class="panel"
style="display:none">


<h1>
新建商品
</h1>


<p>

通过1688链接自动采集商品

</p>



<button onclick="openCollector()">

进入1688采集

</button>



</div>












<!-- ======================
素材管理
====================== -->


<div id="materials"
class="panel"
style="display:none">


<h1>
素材管理
</h1>



<select id="materialCategory">


<option>

全部图片

</option>


<option>

商品主图

</option>



<option>

详情图片

</option>



<option>

Banner图片

</option>



</select>






<div id="materialList"
class="images">


</div>




</div>













<!-- ======================
店铺装修
====================== -->


<div id="decorate"
class="panel"
style="display:none">


<h1>
店铺装修
</h1>







<h3>
首页 Banner
</h3>


<div id="bannerPreview"
class="preview">


</div>


<input

type="file"

id="bannerUpload">







<h3>
首页推荐商品
</h3>



<div id="recommendProducts">

</div>









<h3>
首页公告
</h3>



<textarea id="notice">

</textarea>









<h3>
首页模块标题
</h3>



<input

id="homeTitle"

placeholder="热门商品">








<button>

保存装修

</button>





</div>













<!-- ======================
eBay同步
====================== -->


<div id="ebay"
class="panel"
style="display:none">


<h1>
eBay同步
</h1>



<select>


<option>

选择商品

</option>


</select>




<br><br>




<button>

同步商品

</button>



<button>

同步库存

</button>



<button>

同步价格

</button>



<button>

同步上下架

</button>



</div>












</div>


</div>









<script>


// 菜单展开


function toggleMenu(id){


let menu=document.getElementById(id);



if(menu.style.display==="block"){

menu.style.display="none";


}

else{


menu.style.display="block";


}


}






// 页面切换


function openPage(id){


document
.querySelectorAll(".panel")
.forEach(
item=>{

item.style.display="none";


});


document
.getElementById(id)
.style.display="block";


}







// 新建商品


function openNewProduct(){


openPage("newProduct");


}






function openCollector(){


window.location.href=
"collector.html";


}



</script>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin.js"></script>



</body>


</html>
