<!DOCTYPE html>

<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
China Direct Shop Admin
</title>


<link rel="stylesheet" href="css/style.css">


</head>



<body>



<div class="container">



<h1>
🇨🇳 China Direct Shop
</h1>


<h2>
商品管理后台
</h2>





<form class="admin-box">



<!-- 商品基本信息 -->


<h3>
商品信息
</h3>


<input
id="name"
placeholder="商品中文名称"
>



<input
id="name_en"
placeholder="英文商品名称"
>




<input
id="category"
placeholder="商品分类"
>






<!-- =====================
图片管理
===================== -->


<h3>
图片管理
</h3>



<label>
主图片
</label>



<div
id="mainEditImage"
class="image-box">

</div>



<input

type="file"

id="imageFile"

accept="image/*"

>







<br>



<label>

详情图片

</label>




<div

id="detailEditImages"

class="image-box">

</div>




<input

type="file"

id="detailFiles"

accept="image/*"

multiple

>







<!-- 商品介绍 -->


<h3>
商品描述
</h3>



<textarea

id="description"

placeholder="中文商品介绍">

</textarea>






<textarea

id="description_en"

placeholder="英文商品介绍">

</textarea>







<!-- 价格 -->


<h3>
价格管理
</h3>



<input

id="price"

placeholder="销售价格 USD"

>




<input

id="currency"

value="USD"

placeholder="货币"

>





<input

id="cost_price"

placeholder="采购成本"

oninput="calcPrice()"

>






<input

id="profit_rate"

placeholder="利润率"

readonly

>







<!-- 供应商 -->


<h3>
供应商信息
</h3>



<input

id="supplier"

placeholder="1688供应商名称"

>






<input

id="supplier_url"

placeholder="1688商品链接"

>







<input

id="supplier_contact"

placeholder="供应商联系方式"

>







<!-- eBay -->


<h3>
eBay信息
</h3>



<input

id="ebay_item_id"

placeholder="eBay商品ID"

>







<input

id="ebay_url"

placeholder="eBay购买链接"

>







<input

id="ebay_title"

placeholder="eBay标题"

>







<input

id="ebay_category"

placeholder="eBay分类"

>









<!-- SEO -->


<h3>
SEO
</h3>



<input

id="seo_title"

placeholder="SEO标题"

>






<textarea

id="seo_description"

placeholder="SEO描述">

</textarea>









<!-- 状态 -->


<h3>
商品状态
</h3>



<select id="stock_status">


<option value="上架">

上架

</option>



<option value="下架">

下架

</option>



<option value="缺货">

缺货

</option>


</select>







<br><br>





<button

type="button"

onclick="addProduct()">

保存商品

</button>







<p id="message"></p>





</form>





</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin.js"></script>



</body>


</html>
