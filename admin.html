<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
China Direct Shop 管理后台
</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="admin-layout">



<!-- 左侧菜单 -->

<aside class="sidebar">

<h2>
🇨🇳 CDS后台
</h2>


<button onclick="showPanel('products')">
商品管理
</button>


<button onclick="showPanel('decorate')">
前端装修
</button>


<button onclick="showPanel('seo')">
SEO设置
</button>


<button onclick="showPanel('ebay')">
eBay管理
</button>


</aside>





<!-- 主区域 -->


<main class="content">





<!-- 商品管理 -->


<section id="products">


<h1>
商品编辑
</h1>



<input id="productId" type="hidden">



<label>
商品标题
</label>

<input id="name">



<label>
英文标题
</label>

<input id="name_en">





<h3>
主图片
</h3>


<div id="mainImagePreview"
class="image-box">
</div>


<input 
type="file"
id="mainImage">






<h3>
详情图片
</h3>



<div id="detailImages"
class="image-box">
</div>



<input
type="file"
id="detailImageUpload"
multiple>







<h3>
商品介绍
</h3>


<textarea id="description">
</textarea>


<textarea id="description_en">
</textarea>






<h3>
价格
</h3>


<input
id="cost_price"
placeholder="采购成本"
oninput="calcPrice()">


<input
id="sale_price"
placeholder="销售价格">


<input
id="profit_rate"
readonly
placeholder="利润率">







<h3>
供应商

</h3>


<input id="supplier">

<input 
id="1688_url"
placeholder="1688链接">







<h3>
商品状态

</h3>


<select id="stock_status">

<option>
上架
</option>


<option>
下架
</option>


<option>
缺货
</option>


</select>





<button onclick="updateProduct()">

保存修改

</button>



</section>









<!-- 前端装修 -->


<section 
id="decorate"
style="display:none">


<h1>
网站装修
</h1>



<h3>
首页Banner
</h3>


<div id="bannerPreview"
class="image-box">
</div>


<input
type="file"
id="bannerUpload">





<h3>
首页标题

</h3>


<input
id="homeTitle"
placeholder="例如：中国精选商品直供">






<h3>
首页公告

</h3>


<textarea
id="notice">
</textarea>






<button onclick="saveDecoration()">

保存装修

</button>



</section>









<!-- SEO -->


<section 
id="seo"
style="display:none">


<h1>
SEO设置
</h1>


<input
id="seo_title"
placeholder="网站标题">


<textarea
id="seo_description"
placeholder="网站描述">
</textarea>



<button>
保存SEO
</button>



</section>









<!-- ebay -->


<section 
id="ebay"
style="display:none">


<h1>
eBay管理
</h1>


<input
id="ebay_item_id"
placeholder="eBay商品ID">


<input
id="ebay_url"
placeholder="eBay链接">


<button>
同步eBay状态
</button>



</section>





</main>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/admin.js"></script>


<script>


function showPanel(id){


document.querySelectorAll("main section")
.forEach(
e=>e.style.display="none"
);


document.getElementById(id)
.style.display="block";


}



</script>


</body>


</html>
