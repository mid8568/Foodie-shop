<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
China Direct Shop Admin
</title>


<link rel="stylesheet" href="css/admin.css">


</head>



<body>


<div class="admin-layout">



<!-- 左侧菜单 -->

<div class="sidebar">


<h2>
🇨🇳 CDS后台
</h2>



<button onclick="openPage('products')">
商品管理
</button>



<button onclick="openPage('decorate')">
前端装修
</button>



<button onclick="openPage('images')">
图片管理
</button>



<button onclick="openPage('seo')">
SEO设置
</button>



<button onclick="openPage('ebay')">
eBay同步
</button>



</div>







<!-- 右侧内容 -->


<div class="main">





<!-- 商品管理 -->


<div id="products"
class="panel">


<h1>
商品管理
</h1>



<select id="productSelect">

<option>
选择商品
</option>


</select>





<h3>
商品标题
</h3>

<input id="name">





<h3>
英文标题
</h3>

<input id="name_en">





<h3>
主图
</h3>


<div id="mainImage"
class="preview">


</div>


<input 
type="file"
id="mainUpload">





<h3>
详情图片
</h3>


<div id="detailImages"
class="images">


</div>



<input 
type="file"
multiple
id="detailUpload">






<h3>
商品描述
</h3>


<textarea
id="description">
</textarea>



<textarea
id="description_en">
</textarea>







<h3>
价格


</h3>


<input 
id="cost_price"
placeholder="采购成本">


<input 
id="sale_price"
placeholder="销售价格">



<input
id="profit_rate"
readonly
placeholder="利润率">





<h3>
状态
</h3>


<select id="stock_status">

<option>
上架
</option>

<option>
下架
</option>

<option>
缺货
</option>

</select>




<br><br>


<button onclick="saveProduct()">

保存修改

</button>



</div>










<!-- 前端装修 -->


<div id="decorate"
class="panel"
style="display:none">


<h1>
前端装修
</h1>



<h3>
首页 Banner 图片
</h3>


<div
id="banner"
class="preview">

</div>



<input type="file">






<h3>
首页推荐商品
</h3>


<div id="recommend">


</div>





<h3>
首页公告
</h3>


<textarea
id="notice">
</textarea>






<h3>
首页模块标题
</h3>


<input
id="homeTitle"
placeholder="热门商品">





<button>

保存装修

</button>



</div>









<!-- 图片管理 -->


<div id="images"
class="panel"
style="display:none">


<h1>
图片管理
</h1>


<input
placeholder="搜索商品">


<div id="imageCenter">

</div>



</div>









<!-- SEO -->


<div id="seo"
class="panel"
style="display:none">


<h1>
SEO设置
</h1>


<input
placeholder="网站标题">


<textarea
placeholder="网站描述">
</textarea>


<button>
保存SEO
</button>


</div>









<!-- ebay -->


<div id="ebay"
class="panel"
style="display:none">


<h1>
eBay同步
</h1>



<select>

<option>
选择商品
</option>

</select>



<br><br>


<button>
同步商品
</button>



<button>
同步库存
</button>



<button>
同步价格
</button>



<button>
同步上下架
</button>



</div>







</div>



</div>





<script>


function openPage(id){


document
.querySelectorAll(".panel")
.forEach(
e=>{
e.style.display="none";
}
);



document
.getElementById(id)
.style.display="block";

}



</script>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/admin.js"></script>



</body>

</html>
