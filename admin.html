<!DOCTYPE html>

<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
China Direct Shop Admin
</title>


<link rel="stylesheet" href="css/style.css">


</head>



<body>



<div class="container">



<h1>

🇨🇳 China Direct Shop

</h1>



<h2>

商品管理后台

</h2>






<form class="admin-box">

<!-- =====================
1688采集商品
===================== -->

<div class="card">

<h2>
1688商品采集
</h2>


<div class="form-row">

<input 
id="1688Url"
placeholder="请输入1688商品链接"
style="width:80%;padding:10px;"
>


<button 
type="button"
onclick="collect1688()">
开始采集
</button>


</div>



<div id="collectResult"
style="
display:none;
margin-top:20px;
">


<h3>
采集结果
</h3>



<div>

商品标题：

<input 
id="productTitle"
style="width:100%;"
>

</div>



<br>


<div>

采购价格：

<input 
id="costPrice"
type="number"
oninput="calcPrice()"
>

</div>



<br>



<div>

销售价格：

<input 
id="sellPrice"
readonly
>

</div>




<h3>
主图
</h3>


<div id="mainImages"
class="image-box">

</div>



<h3>
详情图片
</h3>


<div id="detailImages"
class="image-box">

</div>



<br>


<button 
type="button"
onclick="save1688Product()">

保存采集商品

</button>


</div>


</div>



<!-- 商品基本信息 -->


<input

id="name"

placeholder="商品中文名称"

>



<input

id="name_en"

placeholder="英文商品名称"

>




<input

id="category"

placeholder="商品分类"

>





<!-- 主图片 -->


<!-- 主图片 -->


<label>
主图片
</label>


<div id="mainEditImage"
class="image-box">

</div>



<input

type="file"

id="imageFile"

accept="image/*"

>





<!-- 商品详情图片 -->


<input

id="image2"

placeholder="详情图片2地址"

>



<input

id="image3"

placeholder="详情图片3地址"

>



<input

id="image4"

placeholder="详情图片4地址"

>







<!-- 商品介绍 -->


<textarea

id="description"

placeholder="中文商品介绍">

</textarea>






<textarea

id="description_en"

placeholder="英文商品介绍">

</textarea>







<!-- 价格 -->


<input

id="price"

placeholder="销售价格 USD"

>




<input

id="currency"

value="USD"

placeholder="货币"

>




<input

id="cost_price"

placeholder="采购成本"

>








<!-- 供应商 -->


<input

id="supplier"

placeholder="1688供应商名称"

>





<input

id="supplier_url"

placeholder="1688供应商链接"

>





<input

id="supplier_contact"

placeholder="供应商联系方式"

>








<!-- eBay信息 -->


<input

id="ebay_item_id"

placeholder="eBay商品ID"

>





<input

id="ebay_url"

placeholder="eBay购买链接"

>




<input

id="ebay_title"

placeholder="eBay标题"

>




<input

id="ebay_category"

placeholder="eBay分类"

>







<!-- SEO -->


<input

id="seo_title"

placeholder="SEO标题"

>





<textarea

id="seo_description"

placeholder="SEO描述">

</textarea>







<!-- 状态 -->


<select id="stock_status">


<option value="上架">

上架

</option>


<option value="下架">

下架

</option>


<option value="缺货">

缺货

</option>


</select>







<!-- 保存 -->


<button

type="button"

onclick="addProduct()">

保存商品

</button>






<p id="message"></p>





</form>







</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin.js"></script>

<script src="js/1688.js"></script>

</body>


</html>
