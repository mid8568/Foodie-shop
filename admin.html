<!DOCTYPE html>

<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Product Admin
</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body>
<script>


if(
localStorage.getItem("admin_login")
!="yes"

){

location.href="admin-login.html";

}


</script>

<h1>

China Direct Shop

</h1>


<h2>

Add Product

</h2>



<div class="admin-box">


<input id="name" placeholder="商品中文名">


<input id="name_en" placeholder="English Name">


<input id="category" placeholder="分类">


<label>

商品图片

</label>


<input

type="file"

id="imageFile"

accept="image/*"

>


<input id="price" placeholder="售价 USD">


<input id="cost_price" placeholder="成本价">


<input id="supplier" placeholder="1688供应商">


<input id="supplier_url" placeholder="1688链接">


<input id="ebay_url" placeholder="eBay商品链接">



<textarea

id="description_en"

placeholder="Product Description">

</textarea>




<select id="stock_status">


<option value="上架">

上架

</option>


<option value="下架">

下架

</option>


</select>




<button onclick="addProduct()">

Save Product

</button>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin.js"></script>


</body>


</html>
