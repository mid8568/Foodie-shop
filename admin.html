<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDS后台管理</title>
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="admin-layout">

    <!-- =====================
         左侧菜单
    ===================== -->
    <div class="sidebar">
        <h2>CDS后台</h2>

        <a href="javascript:void(0)" onclick="openPage('home.html', this)" class="nav-item active">
            首页
        </a>

        <a href="javascript:void(0)" onclick="openPage('products.html', this)" class="nav-item">
            商品管理
        </a>

        <!-- 图片管理：下拉菜单 -->
        <div class="nav-dropdown">
            <a href="javascript:void(0)" class="nav-item dropdown-btn" onclick="toggleDropdown(this)">
                图片管理
                <span class="arrow">▸</span>
            </a>
            <div class="dropdown-container">
                <a href="javascript:void(0)" onclick="openPage('images-product.html', this)" class="nav-item sub-item">
                    产品图片
                </a>
                <a href="javascript:void(0)" onclick="openPage('images-decor.html', this)" class="nav-item sub-item">
                    装修图片
                </a>
            </div>
        </div>

        <!-- 前端装修：下拉菜单 -->
        <div class="nav-dropdown">
            <a href="javascript:void(0)" class="nav-item dropdown-btn" onclick="toggleDropdown(this)">
                前端装修
                <span class="arrow">▸</span>
            </a>
            <div class="dropdown-container">
                <a href="javascript:void(0)" onclick="openPage('decor-pc.html', this)" class="nav-item sub-item">
                    PC端装修
                </a>
                <a href="javascript:void(0)" onclick="openPage('decor-mobile.html', this)" class="nav-item sub-item">
                    手机端装修
                </a>
            </div>
        </div>

        <a href="javascript:void(0)" onclick="openPage('ebay.html', this)" class="nav-item">
            eBay管理
        </a>
    </div>

    <!-- =====================
         右侧内容
    ===================== -->
    <div class="main-content">
        <!-- 默认加载 home.html -->
        <iframe id="module-frame" src="home.html" frameborder="0"></iframe>
    </div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
