<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
CDS后台管理
</title>


<link rel="stylesheet" href="css/admin.css">

</head>



<body>


<div class="admin-layout">



<!-- 左侧菜单 -->

<div class="sidebar">


<h2>
🇨🇳 CDS后台
</h2>



<button onclick="openPage('products')">
商品管理
</button>


<button onclick="openPage('decorate')">
前端装修
</button>


<button onclick="openPage('images')">
图片管理
</button>


<button onclick="openPage('seo')">
SEO设置
</button>


<button onclick="openPage('ebay')">
eBay同步
</button>



</div>







<div class="main">



<iframe

id="contentFrame"

src="admin-products.html"

frameborder="0">

</iframe>



</div>



</div>





<script>


function openPage(page){


let frame =
document.getElementById(
"contentFrame"
);



if(page==="products"){


frame.src=
"admin-products.html";


}



if(page==="decorate"){


frame.src=
"admin-decorate.html";


}



if(page==="images"){


frame.src=
"admin-images.html";


}



if(page==="seo"){


frame.src=
"admin-seo.html";


}



if(page==="ebay"){


frame.src=
"admin-ebay.html";


}



}



</script>



</body>

</html>
