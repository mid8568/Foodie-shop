<!DOCTYPE html>

<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
China Direct Shop Admin
</title>


<link rel="stylesheet" href="css/admin.css">


</head>



<body>



<div class="admin-layout">



<!-- 左侧菜单 -->

<div class="sidebar">


<h2>
🇨🇳 CDS后台
</h2>





<button onclick="toggleMenu('productMenu')">
商品管理 ▼
</button>



<div id="productMenu"
class="submenu">


<button onclick="openPage('products')">
商品列表
</button>



<button onclick="openPage('newProduct')">
新建商品
</button>


</div>






<button onclick="openPage('materials')">
素材管理
</button>






<button onclick="toggleMenu('shopMenu')">
店铺管理 ▼
</button>



<div id="shopMenu"
class="submenu">


<button onclick="openPage('decorate')">
店铺装修
</button>


</div>






<button onclick="openPage('ebay')">
eBay同步
</button>



</div>









<!-- 主内容 -->

<div class="main">







<!-- =====================
商品管理
===================== -->


<div id="products"
class="panel">


<h1>
商品列表
</h1>



<select id="productSelect">


<option>
请选择商品
</option>


</select>






<h3>
商品中文标题
</h3>


<input id="name">






<h3>
英文标题
</h3>


<input id="name_en">






<h3>
主图
</h3>


<div id="mainImage"
class="preview">

</div>



<input
type="file"
id="mainUpload">



<button>

替换主图

</button>






<h3>
详情图片
</h3>


<div id="detailImages"
class="images">

</div>




<input
type="file"
id="detailUpload"
multiple>



<button>

添加详情图片

</button>






<h3>
商品描述
</h3>


<textarea id="description">

</textarea>



<textarea id="description_en">

</textarea>







<h3>
价格
</h3>



<input
id="cost_price"
placeholder="采购成本">



<input
id="sale_price"
placeholder="销售价格">






<h3>
状态
</h3>


<select id="stock_status">


<option>
上架
</option>


<option>
下架
</option>


<option>
缺货
</option>


</select>







<br><br>



<button onclick="saveProduct()">

保存修改

</button>



</div>














<!-- =====================
新建商品
===================== -->


<div id="newProduct"
class="panel"
style="display:none">


<h1>
新建商品
</h1>



<p>
通过1688链接自动采集商品
</p>



<button onclick="openCollector()">

进入1688采集

</button>



</div>












<!-- =====================
素材管理
===================== -->


<div id="materials"
class="panel"
style="display:none">


<h1>
素材管理
</h1>





<select id="uploadType">


<option>
商品主图
</option>


<option>
详情图片
</option>


<option>
Banner图片
</option>


<option>
其他
</option>


</select>





<input
type="file"
id="materialUpload">



<button onclick="uploadMaterial()">

上传素材

</button>







<h3>
图片分类
</h3>



<select id="materialCategory"
onchange="filterMaterials()">



<option>
全部
</option>


<option>
商品主图
</option>


<option>
详情图片
</option>


<option>
Banner图片
</option>


<option>
其他
</option>


</select>







<div id="materialList"
class="material-grid">

</div>



</div>













<!-- =====================
店铺装修
===================== -->


<div id="decorate"
class="panel"
style="display:none">


<h1>
店铺装修
</h1>





<h3>
首页Banner
</h3>



<div id="bannerPreview"
class="preview">

</div>



<input
type="file"
id="bannerUpload">



<button onclick="uploadBanner()">

上传Banner

</button>








<h3>
首页公告
</h3>


<textarea id="notice">

</textarea>







<h3>
首页模块标题
</h3>


<input
id="homeTitle"
placeholder="热门商品">








<button onclick="saveDecoration()">

保存装修

</button>




</div>













<!-- =====================
eBay同步
===================== -->


<div id="ebay"
class="panel"
style="display:none">


<h1>
eBay同步
</h1>


<button>

同步商品

</button>


<button>

同步库存

</button>


<button>

同步价格

</button>


<button>

同步上下架

</button>



</div>







</div>


</div>









<script>


function toggleMenu(id){


let box =
document.getElementById(id);


if(box.style.display==="block"){

box.style.display="none";

}else{

box.style.display="block";

}


}







function openPage(id){


document
.querySelectorAll(".panel")
.forEach(
p=>{

p.style.display="none";

}

);



document
.getElementById(id)
.style.display="block";


}







function openCollector(){


window.location.href=
"collector.html";


}



</script>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin.js"></script>



</body>


</html>
