<!DOCTYPE html>

<html lang="zh-CN">


<head>

<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
商品编辑
</title>


<link rel="stylesheet" href="css/admin-edit.css">


</head>



<body>



<div class="edit-page">



<h1>
商品编辑
</h1>




<div class="edit-container">





<!-- ======================
基础信息
====================== -->


<h2>
基础信息
</h2>



<div class="form-group">

<label>
中文标题
</label>

<input id="name">

</div>





<div class="form-group">

<label>
英文标题
</label>

<input id="name_en">

</div>





<div class="row">


<div class="form-group">

<label>
商品分类
</label>

<input id="category">

</div>





<div class="form-group">

<label>
状态
</label>


<select id="status">


<option value="上架">
上架
</option>


<option value="下架">
下架
</option>


</select>


</div>


</div>









<!-- ======================
供应信息
====================== -->


<h2>
供应信息
</h2>



<div class="form-group">

<label>
1688商品链接
</label>


<input id="1688_url">


</div>





<div class="row">


<div class="form-group">

<label>
供应商
</label>


<input id="supplier">


</div>





<div class="form-group">

<label>
供应商链接
</label>


<input id="supplier_url">


</div>


</div>





<div class="form-group">

<label>
供应商联系方式
</label>


<input id="supplier_contact">


</div>









<!-- ======================
商品图片
====================== -->


<h2>
商品主图（最多4张）
</h2>


<div
id="main-images"
class="image-manager">

</div>



<div class="upload-box">


<input

type="file"

id="main-image-upload"

multiple>


</div>







<h2>
商品详情图片
</h2>



<div

id="detail-images"

class="image-manager">

</div>





<div class="upload-box">


<input

type="file"

id="detail-image-upload"

multiple>


</div>









<!-- ======================
描述
====================== -->


<h2>
商品描述
</h2>



<div class="form-group">


<textarea

id="description">

</textarea>


</div>





<div class="form-group">


<textarea

id="description_en">

</textarea>


</div>









<!-- ======================
价格库存
====================== -->


<h2>
价格库存
</h2>



<div class="row">



<div class="form-group">

<label>
采购成本
</label>


<input

id="cost_price"

type="number">


</div>






<div class="form-group">

<label>
销售价格
</label>


<input

id="sale_price"

type="number">


</div>



</div>







<div class="form-group">


<label>
库存数量
</label>


<input

id="stock_quantity"

type="number">


</div>









<!-- ======================
规格
====================== -->


<h2>
商品规格
</h2>



<div class="form-group">


<textarea

id="specifications">

</textarea>


</div>









<!-- ======================
SEO
====================== -->


<h2>
SEO设置
</h2>



<div class="form-group">


<label>
SEO标题
</label>


<input id="seo_title">


</div>





<div class="form-group">


<label>
SEO描述
</label>


<textarea

id="seo_description">

</textarea>


</div>









<!-- ======================
按钮
====================== -->


<div class="buttons">


<button

class="save-btn"

onclick="saveProduct()">


保存修改


</button>






<button

class="back-btn"

onclick="backList()">


返回列表


</button>



</div>





</div>


</div>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<script src="js/admin-edit.js">
</script>



</body>


</html>
