<!DOCTYPE html>

<html lang="zh-CN">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
商品编辑
</title>


<link rel="stylesheet" href="css/admin.css">


</head>



<body>



<h1>
商品编辑
</h1>





<h3>
商品中文标题
</h3>


<input id="name">






<h3>
商品英文标题
</h3>


<input id="name_en">








<h3>
主图
</h3>



<div id="mainImage">


</div>



<input
type="file"
id="mainUpload">



<button onclick="uploadMainImage()">

替换主图

</button>








<h3>
详情图片
</h3>



<div id="detailImages">


</div>





<input
type="file"
id="detailUpload"
multiple>



<button onclick="uploadDetailImages()">

增加详情图片

</button>










<h3>
商品描述
</h3>



<textarea
id="description"
rows="8">

</textarea>






<h3>
英文描述
</h3>



<textarea
id="description_en"
rows="8">

</textarea>








<h3>
价格
</h3>



<input
id="cost_price"
placeholder="采购成本">



<input
id="sale_price"
placeholder="销售价格">









<h3>
销售状态
</h3>



<select id="stock_status">


<option>
上架
</option>


<option>
下架
</option>


<option>
缺货
</option>



</select>








<br><br>




<button onclick="saveProduct()">

保存修改

</button>





<button onclick="history.back()">

返回商品列表

</button>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin-edit.js"></script>



</body>


</html>
