<!DOCTYPE html>
<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
编辑商品
</title>



<link rel="stylesheet" href="css/admin-edit.css">


</head>



<body>



<div class="edit-page">



<div class="top-bar">


<button onclick="backProducts()">

← 返回商品列表

</button>


<h1>
商品编辑
</h1>


</div>





<!-- 商品信息 -->


<div class="card">


<h2>
商品信息
</h2>



<label>
中文标题
</label>

<input id="name">





<label>
英文标题
</label>

<input id="name_en">






<label>
商品描述
</label>


<textarea id="description"></textarea>






<label>
价格
</label>


<input 
id="price"
type="number">





<label>
状态
</label>



<select id="status">


<option value="上架">

上架

</option>


<option value="下架">

下架

</option>


</select>



</div>








<!-- 主图 -->


<div class="card">


<h2>
商品主图（4张）
</h2>



<div 
id="main-images"
class="image-box">


</div>



</div>








<!-- 详情图片 -->


<div class="card">


<h2>
详情图片
</h2>



<div
id="detail-images"
class="image-box">


</div>





<input

type="file"

id="detail-upload"

multiple>



<button onclick="uploadDetailImages()">

增加详情图片

</button>



</div>









<button

class="save-btn"

onclick="saveProduct()">


保存修改


</button>





</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin-edit.js"></script>


</body>


</html>
