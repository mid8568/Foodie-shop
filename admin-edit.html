<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
商品编辑
</title>

<link rel="stylesheet" href="css/admin-edit.css">

</head>


<body>


<div class="edit-page">


<h1>
商品编辑
</h1>



<div class="edit-container">



<!-- ======================
基础信息
====================== -->


<h2>
基础信息
</h2>


<div class="form-group">

<label>
中文标题
</label>

<input id="name">

</div>



<div class="form-group">

<label>
英文标题
</label>

<input id="name_en">

</div>



<div class="row">


<div class="form-group">

<label>
商品分类
</label>

<input id="category">

</div>



<div class="form-group">

<label>
状态
</label>


<select id="status">


<option value="上架">
上架
</option>


<option value="下架">
下架
</option>


</select>


</div>


</div>




<!-- ======================
供应信息
====================== -->


<h2>
供应信息
</h2>


<div class="form-group">

<label>
1688商品链接
</label>

<input id="1688_url">

</div>



<div class="row">


<div class="form-group">

<label>
供应商
</label>

<input id="supplier">

</div>



<div class="form-group">

<label>
供应商链接
</label>

<input id="supplier_url">

</div>


</div>



<div class="form-group">

<label>
供应商联系方式
</label>

<input id="supplier_contact">

</div>





<!-- ======================
商品图片
====================== -->


<h2>
商品主图（最多4张）
</h2>


<div class="image-toolbar">


<button
type="button"
onclick="openMainLibrary()">

从图片库选择主图

</button>


<input

type="file"

id="main-image-upload"

multiple>


</div>



<div
id="main-images"
class="image-manager">

</div>




<h2>
商品详情图片
</h2>



<div class="image-toolbar">


<button
type="button"
onclick="openDetailLibrary()">

图片库批量选择

</button>



<input

type="file"

id="detail-image-upload"

multiple>


<button

type="button"

onclick="confirmDetailLibrary()">

确认添加图片

</button>



</div>



<div

id="detail-images"

class="image-manager">

</div>





<!-- ======================
描述
====================== -->


<h2>
商品描述
</h2>



<div class="form-group">


<textarea

id="description">

</textarea>


</div>




<div class="form-group">


<textarea

id="description_en">

</textarea>


</div>






<!-- ======================
SKU管理
====================== -->


<h2>
SKU管理
</h2>



<div class="sku-box">



<button

type="button"

id="addSkuBtn">

+ 添加SKU

</button>




<table class="sku-table">


<thead>

<tr>

<th>
SKU编码
</th>


<th>
SKU名称
</th>


<th>
规格属性
</th>


<th>
采购成本
</th>


<th>
销售价格
</th>


<th>
库存
</th>


<th>
操作
</th>


</tr>

</thead>



<tbody id="skuList">


</tbody>


</table>



</div>







<!-- ======================
按钮
====================== -->


<div class="buttons">


<button

class="save-btn"

onclick="saveProduct()">


保存修改


</button>




<button

class="back-btn"

onclick="backList()">


返回列表


</button>



</div>




</div>


</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<div
id="image-library"
class="image-library">


<div class="library-header">


<h3>
选择图片
</h3>


<button
type="button"
onclick="closeImageLibrary()">

×关闭

</button>


</div>



<div id="library-content">


</div>



<div class="library-footer">


<button
type="button"
onclick="confirmDetailLibrary()">

确认添加详情图片

</button>


<button
type="button"
onclick="closeImageLibrary()">

取消

</button>


</div>



</div>

<script src="js/admin-edit.js">
</script>


</body>

</html>
