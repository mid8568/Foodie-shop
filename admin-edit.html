<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
编辑商品
</title>


<link rel="stylesheet" href="css/product-edit.css">


</head>


<body>


<div class="edit-page">


<h1>
商品编辑
</h1>



<!-- 基础信息 -->

<div class="card">


<h2>
商品信息
</h2>



<label>
中文标题
</label>

<input id="name">



<label>
英文标题
</label>

<input id="name_en">



<label>
商品描述
</label>

<textarea id="description"></textarea>



<label>
价格
</label>

<input id="price">



<label>
状态
</label>


<select id="status">

<option value="上架">
上架
</option>


<option value="下架">
下架
</option>


</select>


</div>





<!-- 主图 -->

<div class="card">


<h2>
商品主图（4张）
</h2>


<div id="main-images"
class="image-box">

</div>


<input
type="file"
id="main-upload">


</div>






<!-- 详情图片 -->

<div class="card">


<h2>
商品详情图片
</h2>



<div id="detail-images"
class="image-box">


</div>



<input
type="file"
id="detail-upload"
multiple>



<button onclick="uploadDetailImages()">

增加详情图片

</button>



</div>






<button
class="save-btn"
onclick="saveProduct()">

保存修改

</button>



</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/product-edit.js"></script>


</body>


</html>
