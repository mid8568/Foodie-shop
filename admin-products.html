<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理</title>
    <link rel="stylesheet" href="css/admin-products.css">
   
</head>

<body>

<div class="product-page">

    <!-- 顶部状态分类 Tab -->
    <div class="tabs">
        <div class="tab-item">全部</div>
        <div class="tab-item active">出售中</div>
        <div class="tab-item">仓库中</div>
    </div>

    <!-- 搜索与筛选区 -->
    <div class="search-bar">
        <div class="input-group">
            <input type="text" id="search-title" placeholder="商品标题">
        </div>
        <div class="input-group">
            <input type="text" id="search-id" placeholder="商品ID 多个ID以逗号隔开">
        </div>
        <div class="input-group">
            <input type="text" id="search-code" placeholder="商家编码">
        </div>
        <button class="btn btn-primary" onclick="searchProduct()">搜索</button>
        <button class="btn" onclick="resetSearch()">重置</button>
    </div>

    <!-- 功能按钮栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <button class="btn">商品装修</button>
            <button class="btn">SKU管理</button>
            <button class="btn">更多批量操作 ▾</button>
        </div>
    </div>

    <!-- 商品列表表格 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th width="30"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
                    <th width="70">图片</th>
                    <th class="name-column">中文标题</th>
                    <th>采购成本</th>
                    <th>价格</th>
                    <th>销量</th>
                    <th>库存</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>

            <!-- 数据动态渲染入口 -->
            <tbody id="product-list">
            </tbody>
        </table>
    </div>

    <!-- 分页加载容器（ID修更为 page-info 以匹配 JavaScript） -->
    <div id="page-info" class="pagination">
    </div>

</div>

<!-- 脚本引入 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin-products.js"></script>

</body>

</html>
