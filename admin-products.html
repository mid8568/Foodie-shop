<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
商品管理
</title>


<style>

body{

margin:0;

background:#f5f6fa;

}


.product-page{

padding:30px;

}


</style>


</head>



<body>


<div class="product-page">


<h1>
商品管理
</h1>



<div class="toolbar">


<input
id="search"
placeholder="搜索商品名称">


<button onclick="searchProduct()">
搜索
</button>



<button onclick="addProduct()">
+ 添加商品
</button>


</div>




<table>


<thead>

<tr>

<th>
图片
</th>


<th>
中文标题
</th>


<th>
英文标题
</th>


<th>
价格
</th>


<th>
状态
</th>


<th>
操作
</th>


</tr>


</thead>



<tbody id="product-list">


</tbody>



</table>



</div>






<!-- 编辑窗口 -->


<div
id="edit-box"
class="modal">


<div class="edit-panel">


<h2>
编辑商品
</h2>



<label>
中文标题
</label>

<input id="edit-name">



<label>
英文标题
</label>

<input id="edit-name-en">





<label>
主图
</label>

<img
id="edit-image"
class="preview">



<input
type="file"
id="image-file">





<label>
商品描述
</label>


<textarea
id="edit-description">
</textarea>




<label>
价格
</label>


<input
id="edit-price"
type="number">





<label>
状态
</label>


<select
id="edit-status">


<option value="上架">
上架
</option>


<option value="下架">
下架
</option>


</select>





<div class="buttons">


<button onclick="saveProduct()">
保存修改
</button>


<button onclick="closeEdit()">
取消
</button>


</div>



</div>


</div>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script src="js/admin-products.js">
</script>


</body>


</html>
