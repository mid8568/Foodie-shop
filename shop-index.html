<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺首页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f5f5; max-width: 480px; margin: 0 auto; min-height: 100vh; color: #333; }
        
        /* 1. 轮播图 */
        .shop-banner img { width: 100%; height: 180px; object-fit: cover; display: block; }

        /* 2. 跑马灯公告 */
        .shop-notice { background: #fffbe6; color: #fa8c16; padding: 10px 15px; font-size: 13px; border-bottom: 1px solid #ffe58f; display: flex; align-items: center; }

        /* 3. 动态商品推荐列表 */
        .shop-products { padding: 12px; }
        .shop-products .title { font-size: 16px; font-weight: bold; margin-bottom: 10px; border-left: 4px solid #1890ff; padding-left: 8px; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .product-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 140px; object-fit: cover; }
        .product-card .info { padding: 8px; }
        .product-card .name { font-size: 13px; height: 36px; line-height: 18px; overflow: hidden; font-weight: 500; }
        .product-card .price { color: #ff4d4f; font-weight: bold; font-size: 15px; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- 动态容器 -->
    <div id="shop-page"></div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ukxxmxnubxjezkwbbxdr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_2IFHfms3ombozpvZCvaeEg_2VZ2z5hJ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener("DOMContentLoaded", renderShopPage);

        async function renderShopPage() {
            const container = document.getElementById("shop-page");

            // 1. 获取数据库装修数据
            const { data: decoData, error } = await supabaseClient
                .from("decorations")
                .select("config")
                .eq("id", 1)
                .single();

            if (error || !decoData) {
                container.innerHTML = "<p style='text-align:center; padding:20px;'>加载页面失败</p>";
                return;
            }

            const config = decoData.config || [];

            // 2. 依次渲染各个装修模块
            for (let item of config) {
                if (item.type === "banner") {
                    const bannerImg = item.data.images[0] || "";
                    container.innerHTML += `
                        <div class="shop-banner">
                            <img src="${bannerImg}" alt="Banner">
                        </div>`;
                } 
                else if (item.type === "notice") {
                    container.innerHTML += `
                        <div class="shop-notice">
                            📢 ${item.data.text}
                        </div>`;
                } 
                else if (item.type === "products") {
                    // 查询商品表获取真实的商品数据
                    const limit = item.data.limit || 4;
                    const { data: products } = await supabaseClient
                        .from("products")
                        .select("*")
                        .eq("stock_status", "上架")
                        .limit(limit);

                    let pListHtml = "";
                    (products || []).forEach(p => {
                        pListHtml += `
                            <div class="product-card">
                                <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}">
                                <div class="info">
                                    <div class="name">${p.name}</div>
                                    <div class="price">¥ ${p.price || 0}</div>
                                </div>
                            </div>`;
                    });

                    container.innerHTML += `
                        <div class="shop-products">
                            <div class="title">${item.data.title || '商品推荐'}</div>
                            <div class="product-grid">
                                ${pListHtml || '<p style="color:#999; grid-column:1/3;">暂无商品</p>'}
                            </div>
                        </div>`;
                }
            }
        }
    </script>
</body>
</html>
