<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China Direct Shop | Official Site</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f7f8fa; color: #333; }

        header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; color: #c0392b; }
        .search-bar input { padding: 8px 16px; width: 300px; border-radius: 20px; border: 1px solid #ccc; outline: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* 组件样式定义 */
        .decor-banner img { width: 100%; border-radius: 8px; object-fit: cover; display: block; margin-bottom: 20px; }
        .decor-notice { background: #e6f7ff; color: #1890ff; padding: 14px 20px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; border-left: 4px solid #1890ff; }
        
        .decor-products { margin-bottom: 30px; }
        .decor-products .section-title { font-size: 22px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
        
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }

        .product-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .p-name { font-size: 14px; font-weight: 600; height: 40px; overflow: hidden; margin-bottom: 8px; }
        .p-bottom { display: flex; justify-content: space-between; align-items: center; }
        .p-price { color: #e74c3c; font-weight: bold; font-size: 16px; }
        .buy-btn { background: #c0392b; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; }

        footer { text-align: center; padding: 30px 0; color: #888; border-top: 1px solid #e0e0e0; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🇨🇳 China Direct Shop</div>
        <div class="search-bar">
            <input type="text" placeholder="Search products..." oninput="handleSearch(this.value)">
        </div>
    </header>

    <div class="container" id="app-content">
        <p style="text-align: center; padding: 50px 0;">Loading page layout...</p>
    </div>

    <footer>
        © China Direct Shop - Direct From China · Worldwide Shipping
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ukxxmxnubxjezkwbbxdr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_2IFHfms3ombozpvZCvaeEg_2VZ2z5hJ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];

        document.addEventListener("DOMContentLoaded", async () => {
            await fetchAllProducts();
            await renderPageLayout();
        });

        async function fetchAllProducts() {
            const { data } = await supabaseClient.from("products").select("*");
            allProducts = data || [];
        }

        async function renderPageLayout() {
            const { data, error } = await supabaseClient
                .from("decorations")
                .select("config")
                .eq("id", 1)
                .single();

            const app = document.getElementById("app-content");
            app.innerHTML = "";

            if (error || !data || !data.config || data.config.length === 0) {
                app.innerHTML = `<p style="text-align: center; padding: 50px 0; color: #999;">页面暂未装修，请在后台发布配置。</p>`;
                return;
            }

            data.config.forEach(comp => {
                const sec = document.createElement("section");

                if (comp.type === "banner") {
                    const h = comp.data.height || 400;
                    sec.className = "decor-banner";
                    sec.innerHTML = `<img src="${comp.data.images[0]}" style="height: ${h}px;">`;
                } 
                else if (comp.type === "notice") {
                    sec.className = "decor-notice";
                    sec.innerText = comp.data.text || "";
                } 
                else if (comp.type === "products") {
                    sec.className = "decor-products";
                    const title = comp.data.title || "Featured Products";
                    const cols = comp.data.cols || 4;
                    const cat = comp.data.category || "全部";
                    const limit = comp.data.limit || 8;

                    // 过滤商品数据
                    let filtered = cat === "全部" 
                        ? allProducts 
                        : allProducts.filter(p => p.category === cat);
                    
                    filtered = filtered.slice(0, limit);

                    let productItemsHtml = filtered.map(item => `
                        <div class="product-card">
                            <img src="${item.image_url || 'https://via.placeholder.com/200'}" alt="${item.title}">
                            <div class="product-info">
                                <div class="p-name">${item.title}</div>
                                <div class="p-bottom">
                                    <span class="p-price">$${parseFloat(item.price || 0).toFixed(2)}</span>
                                    <a href="https://m.me/YOUR_FACEBOOK_USERNAME?text=Inquiry%20about%20${encodeURIComponent(item.title)}" target="_blank" class="buy-btn">Buy Now</a>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    sec.innerHTML = `
                        <div class="section-title">${title}</div>
                        <div class="grid-${cols}">
                            ${productItemsHtml || '<p style="color:#aaa;">该分类暂无商品</p>'}
                        </div>
                    `;
                }

                app.appendChild(sec);
            });
        }

        function handleSearch(keyword) {
            const query = keyword.toLowerCase().trim();
            const cards = document.querySelectorAll(".product-card");
            cards.forEach(card => {
                const name = card.querySelector(".p-name").innerText.toLowerCase();
                card.style.display = name.includes(query) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
