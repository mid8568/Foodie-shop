<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China Direct Shop | Chinese Products</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 手机端 Header -->
<header class="h5-header">
    <div class="h5-logo">🇨🇳 China Direct Shop</div>
    <a href="https://m.me/你的Facebook主页用户名" class="h5-cart" target="_blank">💬</a>
</header>

<!-- 主包装盒（仿 FB 版心，左右居中） -->
<div class="fb-page-wrapper">

    <!-- 1. 顶部大封面海报 (无裁剪、无黑色背景) -->
    <section class="banner">
        <!-- JS 会动态插入图片，静态调试时可用 <img src="海报.jpg"> -->
    </section>

    <!-- 2. 店铺 Profile 区域 -->
    <section class="page-profile-section">
        <div class="profile-container">
            
            <!-- 头像 (压在海报左下角) -->
            <div class="profile-avatar">
                <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?w=200" alt="China Direct Shop Logo" id="site-logo">
            </div>
            
            <!-- 简介信息 -->
            <div class="profile-info">
                <h1 class="shop-name">China Direct Shop</h1>
                <p class="shop-meta">0 位粉丝 · 关注 0 人</p>
                <p class="shop-sub"><span>cn</span> Authentic products from China</p>
                <p class="shop-desc">Snacks | Tea | Gifts | Daily goods</p>
                <p class="shop-shipping">Direct shipping from China worldwide 🌏</p>
                <p class="shop-action">Message us to order.</p>
                <p class="shop-tag">🛍️ 零售购物</p>
            </div>
            
            <!-- 右侧按钮组 -->
            <div class="profile-actions">
                <button class="btn-fb-panel">📊 专业面板</button>
                <button class="btn-fb-edit">✏️ 编辑</button>
                <a href="https://m.me/你的Facebook主页用户名" class="btn-fb-msg" target="_blank">💬 联系我们</a>
            </div>

        </div>
    </section>

    <!-- 3. 搜索栏 -->
    <div class="h5-search">
        <input id="search" placeholder="Search products..." oninput="searchProducts()">
    </div>

    <!-- 4. 商品分类 -->
    <div class="h5-category">
        <button onclick="filterProducts('全部')">All</button>
        <button onclick="filterProducts('茶叶')">🍵 Tea</button>
        <button onclick="filterProducts('零食')">🍜 Snacks</button>
        <button onclick="filterProducts('礼品')">🎁 Gifts</button>
        <button onclick="filterProducts('生活用品')">🏠 Daily Goods</button>
    </div>

    <h2 class="title">Featured Products</h2>

    <!-- 5. 商品列表 -->
    <section class="products" id="product-list">
        Loading products...
    </section>

</div>

<!-- 底部导航 (手机端) -->
<div class="mobile-nav">
    <a href="index.html">🏠<span>Home</span></a>
    <a href="#product-list">🛍️<span>Products</span></a>
    <a href="https://m.me/你的Facebook主页用户名" target="_blank">💬<span>Contact</span></a>
    <a href="about.html">🌏<span>About</span></a>
</div>

<footer>
    © China Direct Shop
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body>
</html>
