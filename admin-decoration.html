<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页装修管理 - Shop Admin</title>
  <link rel="stylesheet" href="decoration.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>首页装修管理</h1>
      <button id="add-module-btn" class="btn btn-primary">+ 添加新模块</button>
    </header>

    <!-- 模块列表区 -->
    <main class="module-list" id="module-list">
      <div class="loading-state">加载中...</div>
    </main>
  </div>

  <!-- 添加/编辑模块弹窗 -->
  <div id="module-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">添加模块</h3>
        <span class="close-btn" id="close-modal">&times;</span>
      </div>
      <form id="module-form">
        <input type="hidden" id="module-id">

        <div class="form-group">
          <label for="module-name">模块名称（后台标识）：</label>
          <input type="text" id="module-name" required placeholder="如：首页热门爆款">
        </div>

        <div class="form-group">
          <label for="module-type">模块类型：</label>
          <select id="module-type" required>
            <option value="product_section">推荐商品块 (Products)</option>
            <option value="notice">公告栏 (Notice)</option>
            <option value="banner_grid">海报多图块 (Banner Grid)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="module-sort">排序（数字越小越靠前）：</label>
          <input type="number" id="module-sort" value="0">
        </div>

        <!-- 动态渲染的 JSON Content 编辑区 -->
        <div id="dynamic-content-fields">
          <!-- JS 会根据选择的 module-type 填充 -->
        </div>

        <div class="form-group row">
          <label for="module-status">启用模块：</label>
          <input type="checkbox" id="module-status" checked>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">保存配置</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin-decoration.js"></script>
</body>
</html>
