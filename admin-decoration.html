<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首页装修管理 - Admin</title>
  <link rel="stylesheet" href="decoration.css" />
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h2>🔨 首页装修管理 (PC Decorator)</h2>
      <button id="btn-save-all" class="btn primary">保存所有修改</button>
    </header>

    <main class="admin-content">
      <!-- 左侧：模块列表与排序 -->
      <section class="panel module-list-panel">
        <div class="panel-header">
          <h3>现有的首页模块</h3>
          <button id="btn-open-add" class="btn secondary">+ 添加新模块</button>
        </div>
        <div id="module-tree" class="module-tree">
          <!-- 动态加载装修模块 -->
          <div class="loading">加载模块列表中...</div>
        </div>
      </section>

      <!-- 右侧：模块编辑区 -->
      <section class="panel module-edit-panel">
        <div class="panel-header">
          <h3 id="edit-panel-title">编辑模块</h3>
        </div>
        <form id="form-module-edit" class="edit-form">
          <input type="hidden" id="edit-module-id" />
          
          <div class="form-item">
            <label>模块名称（后台标识）</label>
            <input type="text" id="edit-module-name" placeholder="例如：首页精选推荐商品" required />
          </div>

          <div class="form-item">
            <label>模块类型</label>
            <select id="edit-module-type" disabled>
              <option value="product_section">推荐商品块 (product_section)</option>
              <option value="notice">首页公告栏 (notice)</option>
              <option value="banner_grid">多图海报广告 (banner_grid)</option>
            </select>
          </div>

          <div class="form-item row">
            <label>排序权重 (值越小越靠前)</label>
            <input type="number" id="edit-module-sort" value="0" />
            <label class="checkbox-label">
              <input type="checkbox" id="edit-module-status" checked /> 是否在首页显示
            </label>
          </div>

          <hr />

          <!-- 动态内容配置区域 (根据类型渲染) -->
          <div id="dynamic-content-editor" class="dynamic-editor">
            <!-- 由 JS 渲染详细配置项 -->
          </div>

          <div class="form-actions">
            <button type="submit" class="btn primary">保存当前模块</button>
            <button type="button" id="btn-delete-module" class="btn danger">删除此模块</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- 选择关联商品的弹窗 -->
  <div id="modal-product-select" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h4>选择推荐商品</h4>
        <span class="close-btn" id="btn-close-modal">&times;</span>
      </div>
      <div class="modal-body">
        <input type="text" id="search-product-input" placeholder="输入商品名称关键字搜索..." />
        <div id="product-select-list" class="product-grid-select">
          <!-- 动态加载商品列表 -->
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-confirm-products" class="btn primary">确认选择</button>
      </div>
    </div>
  </div>

  <script src="admin-decoration.js"></script>
</body>
</html>
